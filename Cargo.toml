[package]
name = "cascii-terminal-decorator"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cascii-core-view = { git = "https://github.com/cascii/cascii-core-view.git", rev = "d48476fda8e3cb2c2ff79480400bceccdf1e58e5", features = ["toml", "multisize"] }
crossterm = "0.28"
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rodio = { version = "0.21", default-features = false, features = ["playback", "mp3"] }
tempfile = "3.20"
