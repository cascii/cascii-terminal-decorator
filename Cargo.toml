[package]
name = "cascii-terminal-decorator"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cascii-core-view = { version = "0.7.2", features = ["toml"] }
crossterm = "0.28"
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.20"
